name: Refresh Token

on:
  repository_dispatch:
    types: [refresh-token] # Trigger via webhook from cron-job.org
  workflow_dispatch: # Trigger manually from GitHub Actions tab

concurrency:
  group: refresh-token
  cancel-in-progress: false

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Verify Runner Online State
        id: check
        uses: actions/github-script@v9
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          script: |
            const api = process.env.GH_PAT ? new github.constructor({ auth: process.env.GH_PAT }) : github;

            // Check if at least one self-hosted runner is online
            try {
              const runnerRes = await api.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const allRunners = runnerRes.data.runners || [];
              const onlineRunners = allRunners.filter((r) => r.status === 'online');

              if (onlineRunners.length === 0) {
                console.log('No self-hosted runners are currently online. Skipping token refresh.');
                core.setOutput('should_run', 'false');
                return;
              }

              console.log(`Verified ${onlineRunners.length} self-hosted runner(s) online.`);
            } catch (err) {
              console.log('Runner online status check skipped (requires GH_PAT secret):', err.message);
            }

            core.setOutput('should_run', 'true');

  refresh-token:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install playwright cryptography
          python3 -m playwright install --with-deps chromium

      - name: Setup auth credentials
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          mkdir -p auth
          [ -n "$EMAIL" ] && echo "$EMAIL" > auth/email || true
          [ -n "$PASSWORD" ] && echo "$PASSWORD" > auth/password || true

      - name: Refresh Tonton Token
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 script/auth.py

