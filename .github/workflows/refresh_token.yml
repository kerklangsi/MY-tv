name: Refresh Token

on:
  repository_dispatch:
    types: [ ] # Trigger via webhook repository_dispatch
  workflow_dispatch: # Trigger manually from GitHub Actions tab

jobs:
  refresh-token:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install playwright cryptography
          python3 -m playwright install --with-deps chromium

      - name: Refresh Tonton Token
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python3 script/auth.py --force
