name: Update IPTV Playlist & EPG

on:
  workflow_dispatch: # Triggered by runner_status_check or manually

concurrency:
  group: update-iptv-schedule
  cancel-in-progress: true

jobs:
  update-iptv:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install cryptography

      - name: Run IPTV Generator
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 script/iptv.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f streams/ playlist.m3u playlist.m3u8 vod.m3u vod.m3u8 epg.xml epg.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV playlist & EPG schedule" && git push)
