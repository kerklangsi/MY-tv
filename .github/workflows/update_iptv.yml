name: Update IPTV Playlist & EPG

on:
  schedule:
    - cron: "0 */3 * * *" # Runs every 3 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: update-iptv-schedule
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Stops gatekeeper if check stalls
    permissions:
      actions: write
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Verify Workflow Queue & Runner Online State
        id: check
        uses: actions/github-script@v9
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          script: |
            const api = process.env.GH_PAT ? new github.constructor({ auth: process.env.GH_PAT }) : github;

            // 1. Check if self-hosted runners are online
            try {
              const runnerRes = await api.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const onlineRunners = (runnerRes.data.runners || []).filter((r) => r.status === 'online');
              if (onlineRunners.length === 0) {
                console.log('No self-hosted runners are currently online. Skipping IPTV update.');
                core.setOutput('should_run', 'false');
                return;
              }
              console.log(`Verified ${onlineRunners.length} self-hosted runner(s) online.`);
            } catch (err) {
              console.log('Runner online status check skipped (requires GH_PAT secret):', err.message);
            }

            // 2. Check for duplicate running workflow jobs
            const activeRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update_iptv.yml',
              status: 'in_progress',
            });

            const currentRunningJob = activeRuns.data.workflow_runs.filter(
              (r) => r.id !== context.runId
            );

            if (currentRunningJob.length > 0) {
              console.log('An IPTV update job is already in progress. Skipping duplicate job.');
              core.setOutput('should_run', 'false');
              return;
            }

            console.log('No duplicate jobs running. Handing off to self-hosted runner.');
            core.setOutput('should_run', 'true');

  update-iptv:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    runs-on: self-hosted
    #timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install cryptography

      - name: Run IPTV Generator
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 script/iptv.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git add -f streams/ playlist.m3u playlist.m3u8 vod.m3u vod.m3u8 epg.xml epg.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV playlist & EPG schedule" && git push)
