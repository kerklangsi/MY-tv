name: Update IPTV Playlist & EPG

on:
  repository_dispatch:
    types: [update-iptv] # Allows external cron webhooks for exact time-based triggers
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: update-iptv
  cancel-in-progress: false

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Verify Runner Online State
        id: check
        uses: actions/github-script@v9
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          script: |
            const api = process.env.GH_PAT ? new github.constructor({ auth: process.env.GH_PAT }) : github;

            // Check if at least one self-hosted runner is online
            try {
              const runnerRes = await api.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const allRunners = runnerRes.data.runners || [];
              const onlineRunners = allRunners.filter((r) => r.status === 'online');

              if (onlineRunners.length === 0) {
                console.log('No self-hosted runners are currently online. Skipping IPTV update.');
                core.setOutput('should_run', 'false');
                return;
              }

              console.log(`Verified ${onlineRunners.length} self-hosted runner(s) online.`);
            } catch (err) {
              console.log('Runner online status check skipped (requires GH_PAT secret):', err.message);
            }

            core.setOutput('should_run', 'true');

  update-live:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install cryptography

      - name: Run Live TV & EPG Generator
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 script/update_live.py

      - name: Commit and push Live TV changes
        run: |
          git config --global user.name "github-actions[bot]"
          git add playlist.m3u playlist.m3u8 all.m3u all.m3u8 epg.xml epg.xml.gz List/LIVE_LIST.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Live TV streams, EPG schedule & catalogs" && git pull --rebase origin main && git push)

  update-vod:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install cryptography

      - name: Run VOD Generator
        env:
          PYTHONUNBUFFERED: "1"
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python3 script/update_vod.py

      - name: Commit and push VOD changes
        run: |
          git config --global user.name "github-actions[bot]"
          git add vod.m3u vod.m3u8 all.m3u all.m3u8 List/SHOWS_LIST.md List/MOVIES_LIST.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update VOD movies & shows playlist and catalogs" && git pull --rebase origin main && git push)

