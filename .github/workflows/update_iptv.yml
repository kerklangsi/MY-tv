name: Update IPTV Playlist & EPG

on:
  schedule:
    - cron: "10 * * * *" # Runs every hour at minute 10
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Verify Workflow Queue & Runner Online State
        id: check
        uses: actions/github-script@v9
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          script: |
            const api = process.env.GH_PAT ? new github.constructor({ auth: process.env.GH_PAT }) : github;

            // 1. Check if an idle self-hosted runner is available
            try {
              const runnerRes = await api.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const allRunners = runnerRes.data.runners || [];
              const onlineRunners = allRunners.filter((r) => r.status === 'online');

              if (onlineRunners.length === 0) {
                console.log('No self-hosted runners are currently online. Skipping IPTV update.');
                core.setOutput('should_run', 'false');
                return;
              }

              const idleRunners = onlineRunners.filter((r) => !r.busy);
              if (idleRunners.length === 0) {
                console.log('All online self-hosted runners are currently busy. Auto-stopping new run.');
                core.setOutput('should_run', 'false');
                return;
              }

              console.log(`Verified ${idleRunners.length} idle self-hosted runner(s) available out of ${onlineRunners.length} online runner(s).`);
            } catch (err) {
              console.log('Runner online status check skipped (requires GH_PAT secret):', err.message);
            }

            // 2. Check for duplicate running workflow jobs
            const activeRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update_iptv.yml',
              status: 'in_progress',
            });

            const currentRunningJob = activeRuns.data.workflow_runs.filter(
              (r) => r.id !== context.runId
            );

            if (currentRunningJob.length > 0) {
              console.log('An IPTV update job is already in progress. Skipping duplicate job.');
              core.setOutput('should_run', 'false');
              return;
            }

            console.log('No duplicate jobs running. Handing off to self-hosted runner.');
            core.setOutput('should_run', 'true');

  update-live:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install cryptography

      - name: Run Live TV & EPG Generator
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 script/update_live.py

      - name: Commit and push Live TV changes
        run: |
          git config --global user.name "github-actions[bot]"
          git add -f streams/live_mytv/ streams/live_tonton/ streams/live_unifi/ streams/radio_mytv/ playlist.m3u playlist.m3u8 all.m3u all.m3u8 epg.xml epg.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Live TV streams & EPG schedule" && git push)

  update-vod:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install cryptography

      - name: Run VOD Generator
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 script/update_vod.py

      - name: Commit and push VOD changes
        run: |
          git config --global user.name "github-actions[bot]"
          git add -f streams/vod_mytv/ streams/vod_tonton/ streams/vod_unifi/ vod.m3u vod.m3u8 all.m3u all.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update VOD movies & shows playlist" && git push)

