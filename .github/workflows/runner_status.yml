name: Runner Status Check

on:
  schedule:
    - cron: "0 */3 * * *" # Runs every 3 hours
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pending Runs & Trigger IPTV Update
        uses: actions/github-script@v9
        with:
          script: |
            const activeRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update_iptv.yml',
            });

            const pendingRuns = activeRuns.data.workflow_runs.filter(
              (r) => r.status === 'queued' || r.status === 'in_progress'
            );

            if (pendingRuns.length > 0) {
              console.log(`Update IPTV workflow is currently ${pendingRuns[0].status}. Skipping trigger to avoid duplicate queueing.`);
              return;
            }

            console.log('No pending IPTV update runs found. Triggering Update IPTV workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update_iptv.yml',
              ref: 'main',
            });
